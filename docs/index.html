<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臨場用人決策</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231f6f4a'/><path d='M9 9c4 4 4 10 0 14M23 9c-4 4-4 10 0 14' stroke='white' stroke-width='2' fill='none'/></svg>">
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M9 9c4 4 4 10 0 14M23 9c-4 4-4 10 0 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><h1>臨場用人決策</h1><small>代打・守備檢查・換投 ｜ CPBL 2024–2025</small></div>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="custom" class="on">自訂情境</button>
    <button data-mode="replay">歷史回放</button>
  </div>
</header>

<main>
  <aside>
    <!-- 自訂情境 -->
    <div id="customPanel">
      <div class="card">
        <div class="card-h"><h2>情境設定</h2></div>
        <div class="card-b">
          <div class="seg full" id="viewSeg">
            <button data-view="offense" class="on">我方進攻・評估代打</button>
            <button data-view="defense">我方防守・評估換投</button>
          </div>
          <div class="row2">
            <div><label class="f">我方球隊</label><select id="myTeam"></select></div>
            <div><label class="f">對手球隊</label><select id="oppTeam"></select></div>
          </div>
          <div class="state">
            <div>
              <label class="f">局數</label>
              <div class="stepper">
                <button id="innDown" aria-label="減一局">−</button>
                <span class="val num" id="innVal">7</span>
                <button id="innUp" aria-label="加一局">+</button>
                <div class="seg" id="halfSeg" style="margin-left:6px">
                  <button data-half="away">上</button>
                  <button data-half="home" class="on">下</button>
                </div>
              </div>
              <label class="f" style="margin-top:12px">出局數</label>
              <div class="outs" id="outs"><button data-o="1" aria-label="1 出局"></button><button data-o="2" aria-label="2 出局"></button></div>
            </div>
            <div>
              <label class="f" style="text-align:center">壘包（點擊切換）</label>
              <svg class="diamond" viewBox="0 0 120 100" id="diamond">
                <path d="M60 92 L100 52 L60 12 L20 52 Z" fill="none" stroke="var(--line)" stroke-width="2"/>
                <rect class="base" data-b="2" x="51" y="3" width="18" height="18" transform="rotate(45 60 12)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <rect class="base" data-b="1" x="91" y="43" width="18" height="18" transform="rotate(45 100 52)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <rect class="base" data-b="4" x="11" y="43" width="18" height="18" transform="rotate(45 20 52)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <path d="M54 86 h12 v4 l-6 6 l-6 -6 z" fill="var(--muted)"/>
              </svg>
            </div>
          </div>
          <div class="row2">
            <div><label class="f">我方得分</label><input type="number" id="myScore" min="0" value="2"></div>
            <div><label class="f">對手得分</label><input type="number" id="oppScore" min="0" value="3"></div>
          </div>

          <!-- 進攻 -->
          <div id="offenseFields">
            <div><label class="f">對方投手</label><select id="oppPitcher"></select></div>
            <div class="row2" style="margin-top:14px">
              <div><label class="f">輪到的打者</label><select id="dueBatter"></select></div>
              <div><label class="f">他目前的守位</label><select id="duePos"></select></div>
            </div>
            <div style="margin-top:14px">
              <label class="f">板凳可用野手</label>
              <input type="search" id="benchFilter" placeholder="搜尋球員…">
              <div class="checklist" id="benchList" style="margin-top:6px"></div>
              <div class="mini-actions"><button class="link" id="benchAll">全選</button><button class="link" id="benchNone">清除</button></div>
            </div>
          </div>

          <!-- 防守 -->
          <div id="defenseFields" class="hidden">
            <div><label class="f">我方場上投手</label><select id="myPitcher"></select></div>
            <div class="row2" style="margin-top:14px">
              <div><label class="f">本場已投球數</label><input type="number" id="pitchCount" min="0" max="160" value="0"></div>
              <div><label class="f">角色</label><div class="seg full" id="roleSeg"><button data-r="1">先發</button><button data-r="0" class="on">後援</button></div></div>
            </div>
            <p class="mut" id="pcHint" style="font-size:11px;margin:6px 0 0"></p>
            <div style="margin-top:14px">
              <label class="f">對手接下來 3 棒</label>
              <div class="row3"><select id="nb1"></select><select id="nb2"></select><select id="nb3"></select></div>
            </div>
            <div style="margin-top:14px">
              <label class="f">牛棚可用投手</label>
              <div class="checklist" id="penList"></div>
              <div class="mini-actions"><button class="link" id="penAll">全選</button><button class="link" id="penNone">清除</button></div>
            </div>
          </div>

          <button class="btn-primary" id="evalBtn">評估</button>
        </div>
      </div>
    </div>

    <!-- 歷史回放 -->
    <div id="replayPanel" class="hidden">
      <div class="card">
        <div class="card-h"><h2>選擇比賽</h2><span class="hint">2025 例行賽</span></div>
        <div class="card-b">
          <div><label class="f">球隊</label><select id="rpTeam"></select></div>
          <label class="toggle server-only"><input type="checkbox" id="onlyPhGames" checked> 只顯示有代打的比賽</label>
          <div class="list" id="gameList"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h2>選擇打席</h2><span class="hint">在該打席開始前做決策</span></div>
        <div class="card-b">
          <label class="toggle"><input type="checkbox" id="lateOnly" checked> 只顯示 7 局以後</label>
          <div class="list" id="paList" style="max-height:420px"><div class="empty" style="padding:24px">先選一場比賽</div></div>
        </div>
      </div>
    </div>
  </aside>

  <section id="result">
    <div class="card empty" id="emptyState">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M32 56 L56 32 L32 8 L8 32 Z"/><circle cx="32" cy="32" r="5"/></svg>
      <p>設定局勢後按「評估」，或切到「歷史回放」挑一個真實的比賽時刻。</p>
    </div>
    <div id="resultBody" class="hidden"></div>
  </section>
</main>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
