<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臨場用人決策</title>
<script src="theme.js?v=20261004-benefit"></script>
<link rel="stylesheet" href="style.css?v=20261004-benefit">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231e40af'/><path d='M9 9c4 4 4 10 0 14M23 9c-4 4-4 10 0 14' stroke='white' stroke-width='2' fill='none'/></svg>">
</head>
<body>
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
  <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 8M3 4v6h6M12 7v5l3 2"/></symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/></symbol>
  <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol>
  <symbol id="icon-compare" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M13 16V7M18 16v-8"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><path d="M20 13v7H4V4h11"/></symbol>
  <symbol id="icon-clear" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  <symbol id="icon-bat" viewBox="0 0 24 24"><path d="m4 20 3-3m0 0 4-3 9-9-1-1-9 9-3 4Zm-3 0 3 3"/></symbol>
  <symbol id="icon-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 5c5 4 5 10 0 14M17 5c-5 4-5 10 0 14"/></symbol>
</defs></svg>
<a class="skip-link" href="#workspace">跳到情境設定</a>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M9 9c4 4 4 10 0 14M23 9c-4 4-4 10 0 14" stroke="var(--on-accent)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><h1>臨場用人決策</h1><small>CPBL · 對決分析 / 2024–2025</small></div>
  </div>
  <div class="spacer"></div>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="切換為淺色主題"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><symbol id="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/></symbol><symbol id="theme-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol></defs><use href="#theme-sun"/></svg><span>淺色</span></button>
  <div class="seg" id="modeSeg">
    <button data-mode="custom" class="on"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"/></svg>自訂情境</button>
    <button data-mode="replay"><svg class="ui-icon" aria-hidden="true"><use href="#icon-history"/></svg>歷史回放</button>
  </div>
</header>

<div class="matchday-intro">
  <div><p class="eyebrow">打席之間 / MATCHUP DESK</p><h2>下一個打席，先看對決。</h2><p class="intro-note">比較代打與換投人選，確認守位，再看投手近期配球。</p></div>
  <div class="season-note"><span>資料球季</span><strong>2024–25</strong><span>歷史資料分析</span></div>
</div>
<nav class="mobile-jump" aria-label="頁面區域"><a href="#workspace">情境設定</a><a href="#result">查看結果 <span aria-hidden="true">↓</span></a></nav>
<main>
  <aside id="workspace" tabindex="-1">
    <!-- 自訂情境 -->
    <div id="customPanel">
      <div class="card">
        <div class="card-h"><h2>情境設定</h2></div>
        <div class="card-b">
          <div class="seg full" id="viewSeg">
            <button data-view="offense" class="on"><svg class="ui-icon" aria-hidden="true"><use href="#icon-bat"/></svg>我方進攻・評估代打</button>
            <button data-view="defense"><svg class="ui-icon" aria-hidden="true"><use href="#icon-ball"/></svg>我方防守・評估換投</button>
          </div>
          <div class="row2">
            <div><label class="f" for="myTeam">我方球隊</label><select id="myTeam"></select></div>
            <div><label class="f" for="oppTeam">對手球隊</label><select id="oppTeam"></select></div>
          </div>
          <div class="state">
            <div class="state-control">
              <label class="f">局數</label>
              <div class="stepper">
                <button id="innDown" aria-label="減一局">−</button>
                <span class="val num" id="innVal">7</span>
                <button id="innUp" aria-label="加一局">+</button>
                <div class="seg" id="halfSeg" style="margin-left:6px">
                  <button data-half="away">上</button>
                  <button data-half="home" class="on">下</button>
                </div>
              </div>
              <div class="out-setting"><span class="f">出局數</span><div class="outs" id="outs"><button data-o="1" aria-label="1 出局"></button><button data-o="2" aria-label="2 出局"></button></div><output id="outsValue">1 出局</output></div>
            </div>
            <div class="base-setting">
              <label class="f">壘上跑者</label>
              <svg class="diamond" viewBox="0 0 120 100" id="diamond">
                <path d="M60 92 L100 52 L60 12 L20 52 Z" fill="none" stroke="var(--line)" stroke-width="2"/>
                <rect class="base" data-b="2" x="51" y="3" width="18" height="18" transform="rotate(45 60 12)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <rect class="base" data-b="1" x="91" y="43" width="18" height="18" transform="rotate(45 100 52)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <rect class="base" data-b="4" x="11" y="43" width="18" height="18" transform="rotate(45 20 52)" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
                <path d="M54 86 h12 v4 l-6 6 l-6 -6 z" fill="var(--muted)"/>
              </svg>
              <div id="baseControls"><button type="button" data-b="1">一壘</button><button type="button" data-b="2">二壘</button><button type="button" data-b="4">三壘</button></div>
            </div>
          </div>
          <div class="row2 score-controls">
            <div><label class="f" for="myScore">我方得分</label><div class="score-stepper"><button type="button" data-score="myScore" data-delta="-1" aria-label="我方減一分">−</button><input type="number" id="myScore" min="0" step="1" value="2"><button type="button" data-score="myScore" data-delta="1" aria-label="我方加一分">+</button></div></div>
            <div><label class="f" for="oppScore">對手得分</label><div class="score-stepper"><button type="button" data-score="oppScore" data-delta="-1" aria-label="對手減一分">−</button><input type="number" id="oppScore" min="0" step="1" value="3"><button type="button" data-score="oppScore" data-delta="1" aria-label="對手加一分">+</button></div></div>
          </div>

          <!-- 進攻 -->
          <div id="offenseFields">
            <div><label class="f" for="oppPitcher">對方投手</label><select id="oppPitcher"></select></div>
            <div class="row2" style="margin-top:14px">
              <div><label class="f" for="dueBatter">輪到的打者</label><select id="dueBatter"></select></div>
              <div><label class="f" for="duePos">目前守位</label><select id="duePos"></select></div>
            </div>
            <div style="margin-top:14px">
              <label class="f">板凳可用野手（請確認今日可上場）</label>
              <div id="benchAvailability" class="today-availability" aria-live="polite"></div>
              <button type="button" class="link bench-toggle-all" id="benchToggleAll">全部展開</button>
              <input type="search" id="benchFilter" aria-label="搜尋板凳球員" placeholder="搜尋球員…">
              <div class="checklist" id="benchList" style="margin-top:6px"></div>
              <div class="mini-actions"><button class="link" id="benchAll" aria-label="全選所有板凳球員">全選</button><button class="link" id="benchNone" aria-label="清除所有板凳球員">清除</button></div>
            </div>
          </div>

          <!-- 防守 -->
          <div id="defenseFields" class="hidden">
            <div><label class="f" for="myPitcher">我方場上投手</label><select id="myPitcher"></select></div>
            <div class="row2" style="margin-top:14px">
              <div><label class="f" for="pitchCount">本場已投球數</label><input type="number" id="pitchCount" min="0" max="160" value="0"></div>
              <div><label class="f">本場角色</label><div class="seg full" id="roleSeg"><button data-r="1">先發</button><button data-r="0" class="on">後援</button></div></div>
            </div>
            <p class="mut role-confirm">請確認本場角色與球數。</p><p class="mut" id="pcHint"></p>
            <div style="margin-top:14px">
              <label class="f">對手接下來 3 棒</label>
              <div class="next-batters"><div class="next-batter"><label for="nb1">第 1 棒</label><select id="nb1" aria-label="接下來第一棒"></select><span class="next-hand" data-next-hand="nb1"></span></div><div class="next-batter"><label for="nb2">第 2 棒</label><select id="nb2" aria-label="接下來第二棒"></select><span class="next-hand" data-next-hand="nb2"></span></div><div class="next-batter"><label for="nb3">第 3 棒</label><select id="nb3" aria-label="接下來第三棒"></select><span class="next-hand" data-next-hand="nb3"></span></div></div>
            </div>
            <div style="margin-top:14px">
              <label class="f">牛棚可用投手（請確認今日可上場）</label>
              <div id="pitcherGroups"></div>
              <div class="checklist" id="penList"></div>
              <div class="mini-actions"><button class="link" id="penAll" aria-label="全選牛棚投手"><svg class="ui-icon" aria-hidden="true"><use href="#icon-check"/></svg>全選</button><button class="link" id="penNone" aria-label="清除牛棚投手"><svg class="ui-icon" aria-hidden="true"><use href="#icon-clear"/></svg>清除</button></div>
            </div>
          </div>

          <div id="formError" aria-live="polite"></div><button class="btn-primary" id="evalBtn" disabled><svg class="ui-icon" aria-hidden="true"><use href="#icon-compare"/></svg>評估</button>
        </div>
      </div>
    </div>

    <!-- 歷史回放 -->
    <div id="replayPanel" class="hidden">
      <div class="card">
        <div class="card-h"><h2>選擇比賽</h2><span class="hint">2025 例行賽</span></div>
        <div class="card-b">
          <div><label class="f" for="rpTeam">球隊</label><select id="rpTeam"></select></div>
          <label class="toggle server-only"><input type="checkbox" id="onlyPhGames" checked> 只顯示有代打的比賽</label>
          <div class="list" id="gameList"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h2>選擇打席</h2><span class="hint">在該打席開始前做決策</span></div>
        <div class="card-b">
          <label class="toggle"><input type="checkbox" id="lateOnly" checked> 只顯示 7 局以後</label>
          <div class="list" id="paList" style="max-height:420px"><div class="empty" style="padding:24px">先選一場比賽</div></div>
        </div>
      </div>
    </div>
  </aside>

  <section id="result">
    <a class="result-return" href="#workspace">調整情境 <span aria-hidden="true">↑</span></a>
    <div class="card empty" id="emptyState">
      <span class="eyebrow">對決準備</span>
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M32 56 L56 32 L32 8 L8 32 Z"/><circle cx="32" cy="32" r="5"/></svg>
      <h2>這個打席，誰適合上場？</h2>
      <p>選好球隊、投打人選與局面，按「評估」比較。<br>想看實際比賽，可切到「歷史回放」。</p>
      <div class="desk-guide"><span><b>01</b> 設定局面</span><span><b>02</b> 比較人選</span><span><b>03</b> 查看配球</span></div>
    </div>
    <div id="resultBody" class="hidden"></div>
  </section>
</main>

<script src="engine.js?v=20261004-benefit"></script>
<script src="pitch-change.js?v=20261004-benefit"></script>
<script src="pitcher-groups.js?v=20261004-benefit"></script>
<script src="app.js?v=20261004-benefit"></script>
</body>
</html>
